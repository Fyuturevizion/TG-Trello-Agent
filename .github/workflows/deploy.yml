name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Load Cloudflare credentials (GitHub secrets, then non-empty .env)
        env:
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SECRET_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$SECRET_TOKEN" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECRET_ACCOUNT" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$SECRET_ACCOUNT" >> "$GITHUB_ENV"
          fi
          for f in .env .dev.vars; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              case "$line" in
                CLOUDFLARE_API_TOKEN=*)
                  val="${line#CLOUDFLARE_API_TOKEN=}"
                  if [ -n "$val" ]; then
                    echo "CLOUDFLARE_API_TOKEN=$val" >> "$GITHUB_ENV"
                  fi
                  ;;
                CLOUDFLARE_ACCOUNT_ID=*)
                  val="${line#CLOUDFLARE_ACCOUNT_ID=}"
                  if [ -n "$val" ]; then
                    echo "CLOUDFLARE_ACCOUNT_ID=$val" >> "$GITHUB_ENV"
                  fi
                  ;;
              esac
            done < <(grep -E '^(CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID)=' "$f" || true)
          done
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=53d52ffd40feb5356ce596aadef30109" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN. Add it to .env in the repo, .dev.vars, or GitHub Actions secrets (same value as local npm run deploy)."
            exit 1
          fi
          npx wrangler deploy
